<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SVG Tracer — Stencil Sheet Maker V5</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0a; --surface:#161616; --surface2:#202020; --border:#2c2c2c;
  --accent:#e8ff00; --accent2:#ff4400; --accent3:#00aaff;
  --text:#e0e0e0; --muted:#666; --green:#00e676; --tap:52px; --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100dvh;min-height:100vh}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:18px;letter-spacing:.1em;text-transform:uppercase;line-height:1}
.logo em{color:var(--accent);font-style:normal}
.logo small{display:block;font-weight:400;font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:2px}

/* LAYOUT MOBILE — card order: Load→Result→Settings→Gemini */
.content{padding:0 16px 100px;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
#card1{order:1}
#card3{order:2}
#card2{order:3}
#card4{order:4}

/* LAYOUT PC */
@media(min-width:800px){
  body{padding-bottom:0}
  .content{max-width:1200px;padding:20px 28px 60px;display:grid;
    grid-template-columns:360px 1fr;grid-template-rows:auto auto auto;column-gap:20px;align-items:start}
  #card1{grid-column:1;grid-row:1;margin-top:0;order:unset}
  #card2{grid-column:1;grid-row:2;order:unset}
  #card4{grid-column:1;grid-row:3;order:unset}
  #card3{grid-column:2;grid-row:1/4;margin-top:0;position:sticky;top:76px;order:unset}
  .card-body{padding:20px}
  .step-card{margin-top:14px}
  .svg-preview-wrap{min-height:340px}
  #svg-display svg{max-height:400px!important}
  .variant-thumb{width:88px;height:88px}
  .status-bar{padding-left:28px;padding-right:28px}
}

/* CARDS */
.step-card{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:opacity .3s,filter .3s}
.step-card.inactive{opacity:.35;pointer-events:none;filter:grayscale(.4)}
.card-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface2)}
.card-num{background:var(--accent);color:#000;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-num.gemini{background:var(--accent3)}
.card-num.done{background:var(--green)}
.card-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.card-subtitle{font-size:9px;color:var(--muted);letter-spacing:.08em;margin-left:auto}
.card-body{padding:16px}

/* DROP ZONE */
.dropzone{border:2px dashed var(--border);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;position:relative;background:rgba(255,255,255,.02);transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:120px}
.dropzone.over{border-color:var(--accent);background:rgba(232,255,0,.04)}
.dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-icon{font-size:36px;line-height:1}
.dz-title{font-size:13px;color:var(--text);font-weight:600}
.dz-sub{font-size:10px;color:var(--muted)}
.file-ok{display:none;align-items:center;gap:10px;background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);border-radius:8px;padding:10px 14px;font-size:11px;color:var(--green);margin-top:10px}
.file-ok .chg{margin-left:auto;font-size:10px;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
#img-preview-wrap{display:none;margin-top:12px;border-radius:8px;overflow:hidden;background:#222}
#canvas-original{max-width:100%;display:block}

/* BUTTONS & OTHER STYLES (省略なし) */
/* ... (元のCSSを維持) ... */
</style>
</head>
<body>

<div class="spinner-overlay" id="spinner">
  <div class="spinner-ring"></div>
  <div class="spinner-text" id="spinner-text">処理中...</div>
</div>
<div class="toast" id="toast"></div>

<header>
  <div class="logo"><em>SVG</em> Tracer<small>for Stencil Sheet Maker</small></div>
</header>

<div class="content">
  <div class="step-card" id="card1">
    <div class="card-header">
      <div class="card-num" id="cn1">1</div>
      <div class="card-title">Load Image</div>
    </div>
    <div class="card-body">
      <div class="dropzone" id="dropzone">
        <input type="file" id="file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp">
        <span class="dz-icon">🖼️</span>
        <div class="dz-title">タップして画像を選択</div>
        <div class="dz-sub">カメラ · 写真ライブラリ · ファイル / PNG · JPG · WEBP</div>
      </div>
      <div class="file-ok" id="file-ok">
        <span>✓</span>
        <span id="file-name-disp" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span>
        <button class="chg" onclick="changeFile()">変更</button>
      </div>
      <div id="img-preview-wrap">
        <canvas id="canvas-original"></canvas>
      </div>
    </div>
  </div>

  <div class="step-card inactive" id="card2">
    <details>
      <summary class="card-header" style="list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px">
        <div class="card-num" id="cn2">2</div>
        <div class="card-title">Trace Settings</div>
        <span class="card-subtitle">タップで開く／閉じる ▼</span>
      </summary>
    <div class="card-body">
      <div class="ctrl">
        <div class="ctrl-head">
          <div class="ctrl-info">
            <div class="ctrl-label">Threshold（しきい値）</div>
          </div>
          <span class="ctrl-val" id="v-thresh">128</span>
        </div>
        <input type="range" id="r-thresh" min="1" max="254" value="128">
      </div>
      <div style="margin-top:14px">
        <button class="btn btn-retrace" id="btn-retrace" disabled onclick="runTrace(true)">
          ↺ 設定を変えて再トレース
        </button>
      </div>
    </div>
    </details>
  </div>

  <div class="step-card inactive" id="card4">
    <div class="card-header">
      <div class="card-num gemini">AI</div>
      <div class="card-title">Gemini AI 高品質変換</div>
    </div>
    <div class="card-body">
      <div class="api-input-wrap">
        <input type="password" class="api-input" id="api-key-input" placeholder="AIza..." autocomplete="off" oninput="onApiKeyInput()">
        <button class="api-toggle-vis" onclick="toggleApiVis()">👁</button>
      </div>
      <div class="api-status" id="api-status"></div>
      
      <div class="gemini-progress" id="gemini-progress">
        <div class="gemini-step" id="gs1"><span class="gs-icon">📤</span><span class="gs-label">画像を送信中...</span></div>
        <div class="gemini-step" id="gs2"><span class="gs-icon">🎨</span><span class="gs-label">画像を受信中...</span></div>
        <div class="gemini-step" id="gs3"><span class="gs-icon">✏️</span><span class="gs-label">トレース中...</span></div>
        <div class="gemini-step" id="gs4"><span class="gs-icon">✅</span><span class="gs-label">完了</span></div>
      </div>

      <button class="btn btn-gemini" id="btn-gemini" disabled onclick="runGeminiEnhance()">
        ✦ Gemini で高品質変換
      </button>
    </div>
  </div>

  <div class="step-card inactive" id="card3">
    <div class="card-header">
      <div class="card-num" id="cn3">▶</div>
      <div class="card-title">Result &amp; Export</div>
    </div>
    <div class="card-body">
      <div class="variants-scroll" id="variants-scroll"></div>
      <div class="svg-preview-wrap">
        <div id="svg-display"></div>
        <div class="svg-source-badge" id="svg-source-badge" style="display:none"></div>
      </div>
      <button class="btn btn-export" id="btn-export" disabled onclick="exportSVG()">
        ↓ Download default.svg
      </button>
    </div>
  </div>
</div>

<div class="status-bar">
  <span class="msg ok" id="st-msg">画像を読み込んでください</span>
  <span class="status-badge" id="st-badge">Ready</span>
</div>

<script>
const S = {
  imgEl: null, imgW: 0, imgH: 0, imgBase64: '',
  variants: [], selectedVariant: 0,
  variantCount: 3, exportSize: 'original',
  geminiStyle: 'standard',
  svgSource: 'auto',
};
const TRACE_DIM = 400;
const GEMINI_IMAGE_MODEL = 'gemini-2.5-flash-image';

// ============================================================
// FILE LOAD (修正: リサイズ済みCanvasからBase64を生成)
// ============================================================
function loadFile(file) {
  setMsg('processing', '画像を読み込み中...');
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = async () => {
    S.imgEl = img;
    let w = img.naturalWidth, h = img.naturalHeight;
    const ratio = TRACE_DIM / Math.max(w, h);
    w = Math.round(w * ratio); h = Math.round(h * ratio);
    S.imgW = w; S.imgH = h;

    const canvas = document.getElementById('canvas-original');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);

    // ✅ 修正: 巨大な元ファイルではなく、リサイズ済みCanvasから軽量JPEGを生成して保存
    S.imgBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

    document.getElementById('img-preview-wrap').style.display = 'block';
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('file-ok').style.display = 'flex';
    document.getElementById('file-name-disp').textContent = file.name;
    document.getElementById('card2').classList.remove('inactive');
    document.getElementById('card4').classList.remove('inactive');
    document.getElementById('btn-retrace').disabled = false;
    checkGeminiBtn();
    URL.revokeObjectURL(url);
    await runTrace(false);
  };
  img.src = url;
}

// ============================================================
// GEMINI AI ENHANCE (修正: キャメルケース inlineData, mimeType)
// ============================================================
async function runGeminiEnhance() {
  const apiKey = document.getElementById('api-key-input').value.trim();
  if (!apiKey || !S.imgBase64) return;

  showGeminiProgress(true);
  setMsg('processing', 'Gemini でステンシル変換中...');

  try {
    setGeminiStep(1, 'active');
    const prompt = "Convert this illustration into a stencil-ready pure black and white image. Pure white background, pure black shapes.";

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 90000);

    const resp = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_IMAGE_MODEL}:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          contents: [{ parts: [
            { text: prompt },
            { inlineData: { mimeType: 'image/jpeg', data: S.imgBase64 } } // ✅ 修正
          ]}],
          generationConfig: { responseModalities: ['TEXT', 'IMAGE'], temperature: 1.0 }
        })
      }
    );
    clearTimeout(timeoutId);

    const data = await resp.json();
    const parts = data?.candidates?.[0]?.content?.parts || [];
    
    // デバッグログも修正
    console.log('[Gemini] status:', resp.status, '| parts:', parts.map(p => p.inlineData ? 'IMAGE' : 'TEXT'));

    if (!resp.ok) throw new Error(data?.error?.message || `HTTP ${resp.status}`);
    setGeminiStep(1, 'done');

    // ✅ 画像パートの取得 (キャメルケースに修正)
    setGeminiStep(2, 'active');
    let imgB64 = null, imgMime = 'image/png';
    for (const part of parts) {
      if (part.inlineData?.data) { // ✅ 修正
        imgB64  = part.inlineData.data;
        imgMime = part.inlineData.mimeType || 'image/png'; // ✅ 修正
        break;
      }
    }

    if (!imgB64) throw new Error("Geminiが画像を返しませんでした。プロンプトやモデル設定を確認してください。");
    setGeminiStep(2, 'done');

    setGeminiStep(3, 'active');
    await traceFromBase64(imgB64, imgMime);
    setGeminiStep(3, 'done');
    setGeminiStep(4, 'done');

    renderVariants();
    showVariant(0);
    showResultCard();
    S.svgSource = 'gemini';
    setMsg('ok', `✓ Gemini変換完了`);
  } catch(e) {
    setMsg('err', 'Gemini エラー: ' + e.message);
    showToast(e.message);
  }
  showGeminiProgress(false);
}

// ... (残りのヘルパー関数、トレーサーロジックは元のコードを維持) ...
/* (traceImage, traceFromCanvas, extractBoundary, chaikinSmooth, buildSVG, renderVariants などの実装がここに入ります) */

</script>
</body>
</html>
